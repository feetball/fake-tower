name: Release

# Builds the Windows, Linux, macOS, web and Android exports and attaches them to a
# GitHub Release (iOS is an Xcode project to sign yourself: see README.md).
# Android: signed with the release keystore when the repository secrets
# ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_USER / ANDROID_KEYSTORE_PASSWORD are set,
# else with a throwaway debug keystore (installable by sideloading, not for the Play Store).
#   - push a tag v*  (for example: git tag v0.1.0 && git push origin v0.1.0), or
#   - run manually (Actions > Release > Run workflow) with the tag name; the tag is
#     created on the selected commit if it does not exist yet.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (must start with v, e.g. v0.1.0)
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Windows, Linux, macOS, web, Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "Tag '$TAG' must start with v" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup-godot
        with:
          templates: 'true'
          extra-templates: web_nothreads_release.zip macos.zip android_release.apk android_debug.apk
          import: 'true'
      - name: Unit and voice tests
        run: |
          set -o pipefail
          godot --headless --path game -s res://tests/run_tests.gd 2>&1 | tee unit.log
          game/tools/ci_check_log.sh unit.log
          godot --headless --path game -s res://tests/voice_test.gd
      - name: Android SDK, JDK and keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          settings=~/.config/godot/editor_settings-4.5.tres
          mkdir -p "$(dirname "$settings")"
          [ -f "$settings" ] || printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$settings"
          sed -i '/^export\/android\/\(android_sdk_path\|java_sdk_path\)/d' "$settings"
          printf 'export/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$sdk" "$JAVA_HOME" >> "$settings"
          ks="$RUNNER_TEMP/android.keystore"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$ks"
            {
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$ks"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KS_USER"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KS_PASS"
            } >> "$GITHUB_ENV"
          else
            echo "No release keystore secrets: the APK is debug-signed."
            keytool -genkeypair -keystore "$ks" -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
            {
              echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$ks"
              echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
              echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
            } >> "$GITHUB_ENV"
          fi
      - name: Export and zip
        run: |
          game/tools/export_build.sh windows linux macos web android --zip --out "$RUNNER_TEMP/dist"
          mkdir -p release
          for p in windows linux macos web; do
            cp "$RUNNER_TEMP/dist/fake-tower-$p.zip" "release/fake-tower-$TAG-$p.zip"
          done
          cp "$RUNNER_TEMP/dist/fake-tower-android/FakeTower.apk" "release/fake-tower-$TAG-android.apk"
          ls -la release
      - uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the only job that can create releases
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-zips
          path: release
      - name: Create or update release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Fake Tower $TAG" --generate-notes \
              --notes "Windows: unzip and run FakeTower.exe. Linux: unzip, keep the .pck next to the binary. macOS: unzip, then right-click Fake Tower.app > Open (not notarized). Web: upload the unzipped folder to a static host. Android: sideload the APK. Host/join: UDP 27270, browsers join a dedicated server over WebSocket (TCP 27271); see README.txt in each zip and game/SERVER.md."
          fi
