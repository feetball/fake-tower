name: Release

# Builds the Windows and Linux exports and attaches them to a GitHub Release.
#   - push a tag v*  (for example: git tag v0.1.0 && git push origin v0.1.0), or
#   - run manually (Actions > Release > Run workflow) with the tag name; the tag is
#     created on the selected commit if it does not exist yet.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (must start with v, e.g. v0.1.0)
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Windows and Linux
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "Tag '$TAG' must start with v" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          templates: 'true'
          import: 'true'
      - name: Unit and voice tests
        run: |
          set -o pipefail
          godot --headless --path game -s res://tests/run_tests.gd 2>&1 | tee unit.log
          game/tools/ci_check_log.sh unit.log
          godot --headless --path game -s res://tests/voice_test.gd
      - name: Export and zip
        run: |
          game/tools/export_build.sh all --zip --out "$RUNNER_TEMP/dist"
          mkdir -p release
          cp "$RUNNER_TEMP/dist/fake-tower-windows.zip" "release/fake-tower-$TAG-windows.zip"
          cp "$RUNNER_TEMP/dist/fake-tower-linux.zip" "release/fake-tower-$TAG-linux.zip"
          ls -la release
      - uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the only job that can create releases
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-zips
          path: release
      - name: Create or update release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/*.zip --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Fake Tower $TAG" --generate-notes \
              --notes "Windows: unzip and run FakeTower.exe. Linux: unzip, keep the .pck next to the binary. Host/join: UDP port 27270 (see README.txt in each zip)."
          fi
