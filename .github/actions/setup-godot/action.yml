name: Setup Godot
description: >
  Install Godot 4.5.1 (official build: linux x86_64 on Linux runners, the universal app on
  macOS runners) as `godot` on PATH (and $GODOT), with the download cached and verified
  against a pinned SHA-256. Optionally installs the release export templates (the Windows
  and Linux release templates, plus any `extra-templates`; Linux runners only) and the
  project import cache.

inputs:
  templates:
    description: Install the Windows and Linux release export templates (Linux runners only)
    default: 'false'
  extra-templates:
    description: >
      With templates, also install these members of the .tpz (space-separated file names), e.g.
      "web_nothreads_release.zip macos.zip ios.zip android_release.apk android_debug.apk"
      for tools/export_build.sh web / macos / ios / android.
    default: ''
  import:
    description: Run `godot --headless --path game --import` (needed before tests, smoke and export)
    default: 'false'

runs:
  using: composite
  steps:
    - name: Pin versions
      shell: bash
      run: |
        {
          echo "GODOT_VERSION=4.5.1"
          echo "GODOT_BASE_URL=https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable"
          echo "GODOT_ZIP=Godot_v4.5.1-stable_linux.x86_64.zip"
          echo "GODOT_ZIP_SHA256=02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd"
          echo "GODOT_MAC_ZIP=Godot_v4.5.1-stable_macos.universal.zip"
          echo "GODOT_MAC_ZIP_SHA256=65c27959d02aaacfc131ec7ecb90179ba8045200cb02982bf2be96d117010b8a"
          echo "GODOT_TPZ=Godot_v4.5.1-stable_export_templates.tpz"
          echo "GODOT_TPZ_SHA256=1998af37f1387684e2c211cdb483daf492fc64dc6b12096bddcdca25b6910c86"
        } >> "$GITHUB_ENV"

    - name: Cache Godot binary
      id: cache-godot
      uses: actions/cache@v4
      with:
        path: ~/godot-bin
        key: godot-4.5.1-stable-${{ runner.os }}-${{ runner.os == 'macOS' && 'universal' || 'x86_64' }}-v1

    - name: Download and verify Godot (Linux)
      if: runner.os == 'Linux' && steps.cache-godot.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        tmp="$(mktemp -d)"
        curl -sSL --fail --retry 3 -o "$tmp/godot.zip" "$GODOT_BASE_URL/$GODOT_ZIP"
        echo "$GODOT_ZIP_SHA256  $tmp/godot.zip" | sha256sum -c -
        mkdir -p ~/godot-bin
        unzip -q "$tmp/godot.zip" -d ~/godot-bin
        mv ~/godot-bin/Godot_v4.5.1-stable_linux.x86_64 ~/godot-bin/godot
        rm -rf "$tmp"

    - name: Download and verify Godot (macOS)
      if: runner.os == 'macOS' && steps.cache-godot.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        tmp="$(mktemp -d)"
        curl -sSL --fail --retry 3 -o "$tmp/godot.zip" "$GODOT_BASE_URL/$GODOT_MAC_ZIP"
        echo "$GODOT_MAC_ZIP_SHA256  $tmp/godot.zip" | shasum -a 256 -c -
        mkdir -p ~/godot-bin
        # ditto keeps the app bundle's symlinks, permissions and signature intact.
        ditto -x -k "$tmp/godot.zip" ~/godot-bin
        printf '#!/bin/bash\nexec "%s/godot-bin/Godot.app/Contents/MacOS/Godot" "$@"\n' "$HOME" > ~/godot-bin/godot
        rm -rf "$tmp"

    - name: Put godot on PATH
      shell: bash
      run: |
        chmod +x ~/godot-bin/godot
        echo "$HOME/godot-bin" >> "$GITHUB_PATH"
        echo "GODOT=$HOME/godot-bin/godot" >> "$GITHUB_ENV"
        ~/godot-bin/godot --version

    - name: Check templates are supported here
      if: inputs.templates == 'true' && runner.os != 'Linux'
      shell: bash
      run: |
        echo "setup-godot: export templates are only installed on Linux runners (export there, run/build elsewhere)" >&2
        exit 1

    - name: Cache export templates
      id: cache-templates
      if: inputs.templates == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.local/share/godot/export_templates/4.5.1.stable
        key: godot-4.5.1-stable-export-templates-win-linux-v1${{ inputs.extra-templates != '' && format('-{0}', inputs.extra-templates) || '' }}

    - name: Download and verify export templates
      if: inputs.templates == 'true' && steps.cache-templates.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        tmp="$(mktemp -d)"
        curl -sSL --fail --retry 3 -o "$tmp/templates.tpz" "$GODOT_BASE_URL/$GODOT_TPZ"
        echo "$GODOT_TPZ_SHA256  $tmp/templates.tpz" | sha256sum -c -
        dest=~/.local/share/godot/export_templates/4.5.1.stable
        mkdir -p "$dest"
        extra=()
        for f in ${{ inputs.extra-templates }}; do extra+=("templates/$f"); done
        unzip -q -j "$tmp/templates.tpz" templates/version.txt templates/windows_release_x86_64.exe templates/linux_release.x86_64 "${extra[@]}" -d "$dest"
        chmod +x "$dest/linux_release.x86_64"
        rm -rf "$tmp"

    - name: Check export templates
      if: inputs.templates == 'true'
      shell: bash
      run: |
        dest=~/.local/share/godot/export_templates/4.5.1.stable
        cat "$dest/version.txt"
        ls -la "$dest"

    - name: Import project
      if: inputs.import == 'true'
      shell: bash
      run: godot --headless --path game --import
